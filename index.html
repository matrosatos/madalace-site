<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaDaLace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="img/logo.png" alt="MaDaLace Logo" class="logo">
            <p class="brand-description">
                Created by two childhood friends who love wearing lace and making the world a more beautiful place.
            </p>
        </div>
    </header>

    <!-- Категории -->
    <section class="categories">
        <div class="category">
            <img src="img/category1.jpg" alt="Lingerie">
            <p>Lingerie</p>
        </div>
        <div class="category">
            <img src="img/category2.jpg" alt="Sleepwear">
            <p>Sleepwear</p>
        </div>
        <div class="category">
            <img src="img/category3.jpg" alt="Accessories">
            <p>Accessories</p>
        </div>
    </section>

    <!-- Продукты -->
    <section class="products">
        <div class="product">
            <img src="img/product1.jpg" alt="Lace Bra">
            <div class="product-info">
                <h3>Lace Bra</h3>
                <p>Elegant lace bra with soft cup</p>
                <div class="price">$39.99</div>
                <button>Add to Cart</button>
            </div>
        </div>
        <div class="product">
            <img src="img/product2.jpg" alt="Silk Sleepwear">
            <div class="product-info">
                <h3>Silk Sleepwear</h3>
                <p>Luxurious silk nightgown</p>
                <div class="price">$89.99</div>
                <button>Add to Cart</button>
            </div>
        </div>
        <div class="product">
            <img src="img/product3.jpg" alt="Lace Stockings">
            <div class="product-info">
                <h3>Lace Stockings</h3>
                <p>Delicate lace stockings</p>
                <div class="price">$19.99</div>
                <button>Add to Cart</button>
            </div>
        </div>
    </section>

    <script src="scripts.js"></script>
</body>
</html>
